        deny: []
      - roleKey: zors-bot
        allow: [ViewChannel]
        deny: []
  - key: raid-applicants-private
    description: Only staff, Raid Coordinators, and Zors Bot can view applications.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, ReadMessageHistory]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, ReadMessageHistory]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, ReadMessageHistory]
        deny: []
      - roleKey: raid-coordinator
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, ReadMessageHistory]
        deny: []
      - roleKey: zors-bot
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, EmbedLinks, ReadMessageHistory]
        deny: []
  - key: raid-control-readonly
    description: Officers can read; only the owner, Administrators, and Zors Bot can mutate raid control posts.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, ReadMessageHistory, UseApplicationCommands]
        deny: [AddReactions, SendMessages, SendMessagesInThreads, CreatePublicThreads, CreatePrivateThreads, ManageMessages, ManageThreads]
      - roleKey: zors-bot
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, ManageMessages, ManageThreads, UseApplicationCommands]
        deny: []
  - key: raid-management-readonly
    description: Staff can read and use Zors controls; only the owner, Administrators, and Zors Bot can mutate posts.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, ReadMessageHistory, UseApplicationCommands]
        deny: [AddReactions, SendMessages, SendMessagesInThreads, CreatePublicThreads, CreatePrivateThreads, ManageMessages, ManageThreads]
      - roleKey: raid-coordinator
        allow: [ViewChannel, ReadMessageHistory, UseApplicationCommands]
        deny: [AddReactions, SendMessages, SendMessagesInThreads, CreatePublicThreads, CreatePrivateThreads, ManageMessages, ManageThreads]
      - roleKey: zors-bot
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, ManageMessages, ManageThreads, UseApplicationCommands]
        deny: []
  - key: raid-roster-commands
    description: Raid Coordinators can use commands and reply inside existing roster posts without creating or managing posts.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, UseApplicationCommands]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, ReadMessageHistory, UseApplicationCommands]
        deny: [AddReactions, SendMessages, SendMessagesInThreads, CreatePublicThreads, CreatePrivateThreads, ManageMessages, ManageThreads]
      - roleKey: raid-coordinator
        allow: [ViewChannel, SendMessagesInThreads, ReadMessageHistory, UseApplicationCommands]
        deny: [AddReactions, SendMessages, CreatePublicThreads, CreatePrivateThreads, ManageMessages, ManageThreads]
      - roleKey: zors-bot
        allow: [ViewChannel, SendMessages, SendMessagesInThreads, CreatePublicThreads, EmbedLinks, ReadMessageHistory, ManageMessages, ManageThreads, UseApplicationCommands]
        deny: []
