permissionProfiles:
  - key: public-read
    description: Everyone can view; only approved roles can publish.
    overwrites: []
  - key: announcements-read-only
    description: Everyone can read announcements; only staff can publish.
    overwrites:
      - roleKey: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny: [SendMessages]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: zors-bot
        allow: [ViewChannel]
        deny: []
  - key: welcome-feed
    description: Everyone can read welcome notices; only staff and Zors Bot can publish.
    overwrites:
      - roleKey: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny: [SendMessages]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: discord-admin
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: officer
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: zors-bot
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
  - key: member-chat
    description: Members can view and participate.
    overwrites: []
  - key: runescape-private
    description: Only staff and members with the RuneScaper role can view and participate.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: runescaper
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
