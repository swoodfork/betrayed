categories:
  - key: start-here
    name: "👋 Welcome to Betrayed! 👋"
    aliases:
      - Start Here
      - Welcome To Betrayed!
      - Text Channels
    permissionProfile: public-read
    channels:
      - key: announcements
        name: "🔔announcements"
        aliases:
          - announcements
        type: announcement
        permissionProfile: announcements-read-only
        preserveHistory: true
      - key: server-guide
        name: "📌server-rules"
        aliases:
          - server-guide
          - "📌server-guide"
          - server-rules
        type: text
        permissionProfile: welcome-feed
        preserveHistory: false
      - key: welcome
        name: "👋welcome"
        aliases: [welcome, new-arrivals]
        type: text
        permissionProfile: welcome-feed
        preserveHistory: false
      - key: raid-application
        name: "📝raid-application"
        aliases: ["Raid Application", "raid-application"]
        type: text
        permissionProfile: welcome-feed
        preserveHistory: false
  - key: staff
    name: "🔒 Officer 🔒"
    aliases:
      - Officer
      - Staff
      - "Officer [hidden] 🔒"
    permissionProfile: staff-private
    channels:
      - key: internal-affairs
        name: "🗝️officer-affairs"
        aliases:
          - internal-affairs
          - "🔒internal-affairs"
          - "🔒officer-affairs"
        type: text
        permissionProfile: staff-private
        preserveHistory: true
      - key: zors-command-log
        name: "📜zors-command-log"
        aliases: [zors-command-log]
        type: text
        permissionProfile: staff-private
        preserveHistory: true
        positionAfter: internal-affairs
      - key: zors-raid-control
        name: "🗄️zors-raid-control"
        aliases: [zors-raid-control]
        type: forum
        permissionProfile: raid-control-readonly
        preserveHistory: true
        positionAfter: zors-command-log
      - key: officer-voice
        name: "🔊 Officer Chat"
        aliases:
          - "🔒 Officer Voice"
        type: voice
        permissionProfile: staff-private
        preserveHistory: false

  - key: raid-coordinator
    name: "🔒 Raid Coordinator 🔒"
    aliases:
      - "📋 Raid Coordinator 📋"
    permissionProfile: raid-coordinator-private
    channels:
      - key: coordinator-chat
        name: "🔐coordinator-affairs"
        aliases:
          - "📋coordinator-chat"
          - "🔒coordinator-affairs"
        type: text
        permissionProfile: raid-coordinator-private
        preserveHistory: false
      - key: raid-rosters
        name: "📋raid-rosters"
        aliases: [raid-rosters]
        type: forum
        permissionProfile: raid-roster-commands
        preserveHistory: true
        positionAfter: coordinator-chat
      - key: roster-archives
        name: "🗃️roster-archives"
        aliases: [roster-archives, "Roster Archives"]
        type: forum
        permissionProfile: raid-management-readonly
        preserveHistory: true
        positionAfter: raid-rosters
      - key: raider-responses
        name: "📨raider-responses"
        aliases: ["Raider Response Forum", "📨raider-response-forum"]
        type: forum
        permissionProfile: raid-management-readonly
        preserveHistory: true
        positionAfter: roster-archives
      - key: signup-requests
        name: "📨signup-requests"
        aliases: [signup-requests]
        type: forum
        permissionProfile: raid-management-readonly
        preserveHistory: true
        positionAfter: raider-responses
      - key: raid-applicants
        name: "📨raid-applicants"
        aliases: ["Raid Applicants", "raid-applicants"]
        type: forum
        permissionProfile: raid-applicants-private
        preserveHistory: true
        positionAfter: signup-requests
      - key: coordinator-voice
        name: "🔊 Coordinator Chat"
        aliases:
          - "🔊 Coordinator Voice"
        type: voice
        permissionProfile: raid-coordinator-private
        preserveHistory: false

  - key: council
    name: "🏛️ Council 🏛️"
    permissionProfile: council-private
    channels:
      - key: council-chat
        name: "🔊 Council Chat"
        type: voice
        permissionProfile: council-private
        preserveHistory: false
      - key: zors-council
        name: "⚖️zors-council"
        aliases:
          - "⚔️zors-council"
        type: text
        permissionProfile: council-private
        preserveHistory: false
      - key: tenshock-council
        name: "⚖️tenshock-council"
        aliases:
          - "⚔️tenshock-council"
        type: text
        permissionProfile: council-private
        preserveHistory: false
      - key: herc-council
        name: "⚖️herc-council"
        aliases:
          - "⚔️herc-council"
        type: text
        permissionProfile: council-private
        preserveHistory: false

  - key: warcraft-forever
    name: "🌍 Warcraft Forever 🌍"
    aliases:
      - Warcraft Forever
      - "🌍Warcraft Forever🌍"
    permissionProfile: member-chat
    channels:
      - key: forever-discussion
        name: "👋forever-discussion"
        aliases:
          - forever-discussion
        type: text
        permissionProfile: member-chat
