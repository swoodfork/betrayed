      - roleKey: zors-bot
        allow: [ViewChannel]
        deny: []
  - key: raid-coordinator-private
    description: Only staff and Raid Coordinators can view and participate.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, ReadMessageHistory, Connect, Speak]
