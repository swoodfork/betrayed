        deny: []
      - roleKey: officer
        allow: [ViewChannel, SendMessages, ReadMessageHistory]
        deny: []
      - roleKey: zors-bot
        allow: [ViewChannel]
        deny: []
  - key: staff-private
    description: Only approved staff roles can view and participate.
    overwrites:
      - roleKey: everyone
        allow: []
        deny: [ViewChannel]
      - roleKey: guild-master
        allow: [ViewChannel, SendMessages, ReadMessageHistory, Connect, Speak]
        deny: []
      - roleKey: discord-admin
