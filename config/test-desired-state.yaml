version: 1
target: test

policy:
  deletion: forbidden
  archiveReviewDays: 30
  preserveAllBots: true

roles:
  - key: guild-master
    name: Guild Master
    createIfMissing: true
    hierarchyRank: 0
    color: "#DD7D15"
    permissions:
      - Administrator
  - key: discord-admin
    name: Discord Admin
    createIfMissing: true
    hierarchyRank: 1
    color: "#1F8B4C"
    permissions:
      - Administrator
  - key: officer
    name: Officer
    aliases: [Officers]
    createIfMissing: true
    hierarchyRank: 2
    color: "#AD1457"
    permissions:
      - ViewAuditLog
      - ManageRoles
      - ManageMessages
      - ModerateMembers
      - KickMembers
      - BanMembers
      - ManageNicknames
      - MoveMembers
      - MuteMembers
      - DeafenMembers
  - key: raid-coordinator
    name: Raid Coordinator
    createIfMissing: true
    hierarchyRank: 3
    color: "#1ABC9C"
    permissions:
      - ManageMessages
      - MoveMembers
      - DeafenMembers
